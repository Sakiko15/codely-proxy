# 1Panel 编排一键部署（Go 版 codely-proxy）
# 在 1Panel 容器->编排 中粘贴本文件，自动拉取 GHCR 镜像并启动。
services:
  codely-proxy:
    # GHCR 镜像（CI 自动构建 amd64/arm64，新仓库独立）
    image: ghcr.io/sakiko15/codely-proxy:latest
    container_name: codely-proxy
    restart: unless-stopped
    ports:
      # 默认仅本机可达，公网由 1Panel 反向代理承担（WebUI 登录 + HTTPS）
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - CODELY_PROXY_BIND=0.0.0.0
      - CODELY_PROXY_PORT=8790
      - CODELY_DATA_DIR=/app/data
      # WebUI 管理端账密（A2b：不设则随机生成并打印到容器日志）
      # 强烈建议设置，否则每次重启密码变化且需查日志
      - WEBUI_USER=admin
      - WEBUI_PASS=${WEBUI_PASS:-change-me-strong-password}
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:8790/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
