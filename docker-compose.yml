# 1Panel 编排一键部署（Go 版 codely-proxy）
# 在 1Panel 容器->编排 中粘贴本文件，自动拉取 GHCR 镜像并启动。
services:
  codely-proxy:
    # GHCR 镜像（CI 自动构建 amd64/arm64，新仓库独立）
    image: ghcr.io/sakiko15/codely-proxy:latest
    container_name: codely-proxy
    restart: unless-stopped
    # 优雅停机窗口（稳定性审计 F2）：应用内等待 15s；Docker 默认仅 10s，会在应用窗口之前 SIGKILL
    stop_grace_period: 60s
    ports:
      # 默认仅本机可达，公网由 1Panel 反向代理承担（WebUI 登录 + HTTPS）
      - "127.0.0.1:8790:8790"
    volumes:
      # bind mount 的宿主目录属主不可预知（root/1Panel uid）——镜像内 chown 会被挂载覆盖。
      # entrypoint 以 root 起动后自动 chown /app/data 再降权 codely 运行，无需手工 chown。
      # 备选：加 user: "1000:1000" 以指定 uid 直跑（跳过自修复，需宿主目录属主匹配）；
      #       或改 named volume（codely-data:/app/data，首用继承镜像属主）。
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - CODELY_PROXY_BIND=0.0.0.0
      - CODELY_PROXY_PORT=8790
      - CODELY_DATA_DIR=/app/data
      # WebUI 管理端账密（A2b：不设则随机生成并打印到容器日志，安全默认）
      # ⚠️ code-review #4：不要给 WEBUI_PASS 一个非空默认值——那会静默禁用 A2b 随机密码保护。
      # 设置 WEBUI_PASS 的两种正确姿势：
      #   1) 在 1Panel 编排的 .env 里配 WEBUI_PASS=<你的强密码>（推荐）；
      #   2) 完全不设 → 代理生成随机密码打印到日志，登录 WebUI 后可从日志看到。
      - WEBUI_USER=admin
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:8790/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
