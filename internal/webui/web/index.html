<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codely-proxy 控制台</title>
<!-- 主题首帧解析（阻塞，防 FOUC）：必须先于样式表/主体渲染 -->
<script src="/web/assets/theme.js"></script>
<link rel="stylesheet" href="/web/assets/tokens.css">
<link rel="stylesheet" href="/web/assets/base.css">
<link rel="stylesheet" href="/web/assets/components.css">
</head>
<body>

<!-- 登录框（未认证时显示） -->
<div id="login-modal" class="modal-scrim" hidden>
  <div class="modal-box auth-card" role="dialog" aria-modal="true" aria-label="登录">
    <div class="auth-brand" id="login-brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
      codely-proxy
    </div>
    <div id="login-hint" class="hint-box" hidden></div>
    <form id="login-form">
      <div class="field">
        <label for="login-user">用户名</label>
        <input class="input" id="login-user" autocomplete="username" value="admin">
      </div>
      <div class="field">
        <label for="login-pass">密码</label>
        <input class="input" id="login-pass" type="password" autocomplete="current-password">
      </div>
      <div id="login-err" class="banner banner-danger" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">登录</button>
    </form>
  </div>
</div>

<!-- 应用骨架（认证后显示） -->
<div id="app-root" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
      <span>codely-proxy</span>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="sidebar-foot">
      <button type="button" class="nav-item" id="theme-btn"></button>
      <button type="button" class="nav-item" id="logout-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
        <span>登出</span>
      </button>
      <div class="clock" id="sidebar-clock"></div>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner" id="outlet"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>
</div>

<!-- 设备码登录弹窗（账号页消费） -->
<div id="dev-login-modal" class="modal-scrim" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="设备码授权">
    <div class="modal-title">设备码授权</div>
    <div class="modal-text">访问下方授权链接并确认用户码，完成后账号自动入池。</div>
    <div class="field">
      <label>用户码</label>
      <div class="num" id="dev-user-code">-</div>
    </div>
    <div class="field">
      <label for="dev-url-text">授权链接</label>
      <div class="copy-field">
        <input class="input" id="dev-url-text" readonly>
        <button type="button" class="btn" id="dev-copy-btn">复制授权链接</button>
      </div>
    </div>
    <div class="hint-box" id="dev-status-text">等待授权中...</div>
    <div class="modal-actions">
      <button type="button" class="btn" data-close>关闭</button>
      <button type="button" class="btn btn-primary" id="dev-open-btn">打开授权页</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module" src="/web/assets/main.js"></script>
</body>
</html>
